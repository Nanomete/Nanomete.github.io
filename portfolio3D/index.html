<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #0b0b0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
        }

        canvas { display: block; }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #0b0b0f;
            z-index: 10;
            transition: opacity 0.6s ease;
            text-align: center;
        }

        #loading.hidden { opacity: 0; pointer-events: none; }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #6ea8ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #progress-text { font-size: 14px; color: #9aa4b2; letter-spacing: 0.5px; }

        #ui {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }

        .btn {
            background: rgba(20, 22, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s, border-color 0.2s;
        }

        .btn:hover { background: rgba(40, 44, 58, 0.85); border-color: rgba(255, 255, 255, 0.35); }
        .btn.active { background: #6ea8ff; border-color: #6ea8ff; color: #0b0b0f; }

        #hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 12px;
            color: #9aa4b2;
            background: rgba(20, 22, 30, 0.6);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            white-space: nowrap;
            pointer-events: none;
        }

        #fps {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 5;
            font-size: 12px;
            color: #6ea8ff;
            font-variant-numeric: tabular-nums;
        }

        #error {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(11, 11, 15, 0.9);
            color: #ff7b72;
            z-index: 20;
            font-size: 15px;
            padding: 24px;
            text-align: center;
        }

        #popup {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 6;
            width: 240px;
            padding: 14px 34px 14px 16px;
            background: rgba(20, 22, 30, 0.88);
            border: 1px solid rgba(110, 168, 255, 0.5);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #popup.show { opacity: 1; pointer-events: auto; }

        /* connector line + dot pointing at the 3D anchor point */
        #popup::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -28px;
            width: 28px;
            height: 1px;
            background: #6ea8ff;
        }

        #popup::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -33px;
            width: 9px;
            height: 9px;
            margin-top: -4px;
            border-radius: 50%;
            background: #6ea8ff;
        }

        #popup.left::before { left: auto; right: -28px; }
        #popup.left::after { left: auto; right: -33px; }

        #popup h3 { font-size: 15px; margin-bottom: 6px; color: #6ea8ff; }
        #popup p { font-size: 13px; line-height: 1.5; color: #d5dbe5; }
        #popup a { color: #6ea8ff; text-decoration: underline; }
        #popup a:hover { color: #fff; }

        #popupClose {
            position: absolute;
            top: 6px;
            right: 8px;
            background: none;
            border: none;
            color: #9aa4b2;
            font-size: 18px;
            cursor: pointer;
        }

        #popupClose:hover { color: #fff; }

        @media (max-width: 600px) {
            #hint { white-space: normal; text-align: center; width: 90%; }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="progress-text">Loading model…</div>
    </div>
    <div id="error"></div>

    <div id="hint">Left-drag: Rotate &nbsp;•&nbsp; Right-drag: Pan &nbsp;•&nbsp; Scroll: Zoom</div>
    <div id="fps"></div>

    <div id="popup">
        <button id="popupClose" aria-label="Close">&times;</button>
        <h3 id="popupTitle"></h3>
        <p id="popupText"></p>
    </div>

    <div id="ui">
        <button id="autoRotateBtn" class="btn active">Auto Rotate</button>
        <button id="resetViewBtn" class="btn">Reset View</button>
        <button id="cvViewBtn" class="btn">My CV</button>
        <button id="workshopViewBtn" class="btn">My Workshop</button>
        <button id="fullscreenBtn" class="btn">Fullscreen</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ---------- Scene / Camera / Renderer ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0f);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(8, 6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // ---------- Controls ----------
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.screenSpacePanning = true;
        controls.minDistance = 0.5;
        controls.maxDistance = 200;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.target.set(0, 1, 0);

        // ---------- Lights ----------
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const grid = new THREE.GridHelper(30, 30, 0x2a2f3a, 0x1a1e26);
        scene.add(grid);

        function addPointLight(color, intensity, x, y, z) {
            const light = new THREE.PointLight(color, intensity, 0, 2);
            light.position.set(x, y, z);
            light.castShadow = true;
            light.shadow.mapSize.set(500, 500);
            light.shadow.bias = -0.0005;
            scene.add(light);
            return light;
        }
        addPointLight(0xaa00ff, 50, 0, 1, 1);
        addPointLight(0xaaff88, 80, 0, 9, 1);
        addPointLight(0x00aaff, 100, 3, 3, 1);

        // ---------- Model ----------
        let model;
        let mixer = null;
        const clock = new THREE.Clock();
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const progressText = document.getElementById('progress-text');

        loader.load(
            'model/portfolio.glb',
            (gltf) => {
                model = gltf.scene;
                scene.add(model);

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                resetView();

                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                grid.position.y = center.y - size.y / 2;

                showUI();

                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => {
                        const action = mixer.clipAction(clip);
                        action.setLoop(THREE.LoopRepeat, Infinity);
                        action.play();
                    });
                }

                loadingEl.classList.add('hidden');
                progressText.textContent = 'Done';
            },
            (xhr) => {
                if (xhr.total) {
                    const pct = Math.round((xhr.loaded / xhr.total) * 100);
                    progressText.textContent = `Loading model… ${pct}%`;
                }
            },
            (err) => {
                console.error(err);
                loadingEl.classList.add('hidden');
                const errorEl = document.getElementById('error');
                errorEl.style.display = 'flex';
                errorEl.textContent = 'Failed to load model. Please check the path: model/portfolio.glb';
            }
        );

        function showUI() {
            document.querySelectorAll('#ui .btn').forEach((b) => (b.style.display = 'initial'));
        }
        document.querySelectorAll('#ui .btn').forEach((b) => (b.style.display = 'none'));

        // ---------- Camera views ----------
        // position = where the camera sits, target = the point it looks at.
        // These numbers are placeholders: replace them with your own (see the console log below).
        const views = {
            cv: {
                position: new THREE.Vector3(-0.1, 1, 0),
                target: new THREE.Vector3(2, 1, 0),
                label: {
                    point: new THREE.Vector3(2, 1, 0.1),
                    title: 'My CV',
                    html: `<hr>
                    <b>Full-Name</b>: Nawamin Thongnobpokunamphai<br>
                    <b>College</b>: KU KPS<br>
                    <b>Major</b>: Computer Science<br>
                    <b>Hard-Skills</b>: HTML, CSS, JavaScript/TypeScript, Python, C/C++, Java<br>
                    <b>Soft-Skills</b>: Problem Solving, Teamwork, Communication, Adaptability<br>
                    <hr>
                    Links to Contract<br>
                    <a href="https://nanomete.github.io/" target="_blank" rel="noopener">View full CV</a><br>
                    <a href="https://github.com/nanomete" target="_blank" rel="noopener">View GitHub</a>
                    `
                }
            },
            workshop: {
                position: new THREE.Vector3(3, 1.2, 0),
                target: new THREE.Vector3(-2, 1, 0),
                label: {
                    point: new THREE.Vector3(-2, 1, -1),
                    title: 'My Workshop',
                    html: `<hr>
                    <a href="https://nanomete.github.io/geogen/" target="_blank" rel="noopener">Software Painting</a><br>
                    <a href="https://nanomete.github.io/webgl/webGL.html" target="_blank" rel="noopener">3D Modeling</a><br>`
                }
            }
        };

        // ---------- Popup (text label anchored to a 3D point) ----------
        const popupEl = document.getElementById('popup');
        const popupTitle = document.getElementById('popupTitle');
        const popupText = document.getElementById('popupText');
        let popupAnchor = null;
        const _v = new THREE.Vector3();

        function showPopup(label) {
            if (!label) return;
            popupAnchor = label.point;
            popupTitle.textContent = label.title;
            popupText.innerHTML = label.html; // accepts HTML tags, e.g. <a href=...>
            popupEl.classList.add('show');
        }

        function hidePopup() {
            popupEl.classList.remove('show');
            popupAnchor = null;
        }

        // Called every frame: project the 3D point to screen pixels and place the popup beside it
        function updatePopup() {
            if (!popupAnchor) return;
            _v.copy(popupAnchor).project(camera);
            if (_v.z > 1) { popupEl.style.opacity = 0; return; } // point is behind the camera
            popupEl.style.opacity = '';
            const x = (_v.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-_v.y * 0.5 + 0.5) * window.innerHeight;
            const w = popupEl.offsetWidth;
            const flip = x + 28 + w > window.innerWidth - 130; // keep clear of the right-hand buttons
            popupEl.classList.toggle('left', flip);
            const px = flip ? x - 28 - w : x + 28;
            popupEl.style.transform = `translate(${px}px, ${y}px) translateY(-50%)`;
        }

        document.getElementById('popupClose').addEventListener('click', hidePopup);

        let camTween = null;

        // Smoothly move the camera from where it is now to the chosen view
        function flyTo(view, duration = 1.2, onDone = null) {
            hidePopup();
            camTween = {
                onDone,
                startPos: camera.position.clone(),
                startTarget: controls.target.clone(),
                endPos: view.position,
                endTarget: view.target,
                startTime: performance.now(),
                duration: duration * 1000
            };
        }

        // Called every frame from animate()
        function updateCameraTween() {
            if (!camTween) return;
            const t = Math.min((performance.now() - camTween.startTime) / camTween.duration, 1);
            const k = t * t * (3 - 2 * t); // smoothstep: ease in and out
            camera.position.lerpVectors(camTween.startPos, camTween.endPos, k);
            controls.target.lerpVectors(camTween.startTarget, camTween.endTarget, k);
            if (t === 1) {
                const done = camTween.onDone;
                camTween = null;
                if (done) done();
            }
        }

        // If the user grabs the camera mid-flight, stop the animation
        controls.addEventListener('start', () => { camTween = null; });

        // Debug helper: after you move the camera by hand, its position/target are printed in the console.
        // Copy them into `views` above, then delete this block.
        controls.addEventListener('end', () => {
            console.log('position:', camera.position.toArray().map((n) => +n.toFixed(2)));
            console.log('target:', controls.target.toArray().map((n) => +n.toFixed(2)));
        });

        function goToView(view) {
            if (!model) return;
            controls.autoRotate = false;
            document.getElementById('autoRotateBtn').classList.remove('active');
            flyTo(view, 1.2, () => showPopup(view.label)); // popup appears once the camera arrives
        }

        // Frame the whole model (used on first load and by Reset View)
        function getDefaultView() {
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const dist = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360)) * 1.5;
            return {
                position: new THREE.Vector3(center.x + dist * 0.7, center.y + dist * 0.5, center.z + dist),
                target: center,
                dist
            };
        }

        function resetView() {
            if (!model) return;
            const v = getDefaultView();
            controls.target.copy(v.target);
            camera.position.copy(v.position);
            controls.maxDistance = v.dist * 8;
            controls.update();
        }

        // ---------- Buttons ----------
        document.getElementById('autoRotateBtn').addEventListener('click', (e) => {
            controls.autoRotate = !controls.autoRotate;
            e.currentTarget.classList.toggle('active', controls.autoRotate);
        });

        document.getElementById('resetViewBtn').addEventListener('click', () => {
            if (!model) return;
            flyTo(getDefaultView());
        });

        document.getElementById('cvViewBtn').addEventListener('click', () => goToView(views.cv));
        document.getElementById('workshopViewBtn').addEventListener('click', () => goToView(views.workshop));

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        // ---------- Resize ----------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ---------- Render loop ----------
        let frames = 0;
        let lastTime = performance.now();
        const fpsEl = document.getElementById('fps');

        function animate() {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            else clock.getDelta();
            updateCameraTween();
            controls.update();
            updatePopup();
            renderer.render(scene, camera);

            frames++;
            const now = performance.now();
            if (now - lastTime >= 500) {
                fpsEl.textContent = `${Math.round((frames * 1000) / (now - lastTime))} FPS`;
                frames = 0;
                lastTime = now;
            }
        }
        animate();
    </script>
</body>

</html>
